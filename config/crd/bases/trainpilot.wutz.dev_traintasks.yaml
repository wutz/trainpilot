---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: traintasks.trainpilot.wutz.dev
spec:
  group: trainpilot.wutz.dev
  names:
    kind: TrainTask
    listKind: TrainTaskList
    plural: traintasks
    singular: traintask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.workers
      name: Workers
      type: integer
    - jsonPath: .spec.resources.gpusPerWorker
      name: GPU/Worker
      type: integer
    - jsonPath: .status.restartCount
      name: Restarts
      type: string
    - jsonPath: .status.preemptionCount
      name: Preemptions
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TrainTask is the Schema for the traintasks API.
          It wraps a Kubeflow Trainer v2 TrainJob with queueing, automatic restart,
          node exclusion and per-run-segment billing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TrainTaskSpec defines the desired state of TrainTask.
            properties:
              command:
                description: |-
                  Command is the startup command. It is executed as `bash -c <command>`.
                  Exit code 0 means success, anything else means failure (PRD 7.10).
                items:
                  type: string
                minItems: 1
                type: array
              description:
                description: Description is a free-form note, at most 200 characters.
                maxLength: 200
                type: string
              desiredState:
                default: Running
                description: |-
                  DesiredState stops or continues the task. Stopping releases workers and
                  keeps RUN_ID; continuing resets both restart counters (PRD 7.5).
                enum:
                - Running
                - Stopped
                type: string
              env:
                description: |-
                  Env is injected into every worker. Values matching the sensitive pattern
                  (KEY / TOKEN / SECRET / PASS) are masked in the UI, not in the pod.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              faultTolerance:
                default: {}
                description: FaultTolerance configures automatic restarts and runtime
                  limits.
                properties:
                  autoRestart:
                    default: true
                    description: |-
                      AutoRestart restarts the task after process failures, startup check failures
                      and node failures.
                    type: boolean
                  maxPreemptions:
                    default: 40
                    description: |-
                      MaxPreemptions is the platform-side re-queue budget consumed by preemptions
                      (default 40). It is not part of the user-facing create form.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  maxRestarts:
                    default: 10
                    description: |-
                      MaxRestarts bounds failure-class automatic restarts (1-100, default 10).
                      Preemptions do not consume this budget.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  maxRuntimeSeconds:
                    default: 604800
                    description: |-
                      MaxRuntimeSeconds bounds the accumulated billed time of one run
                      (1-720 hours, default 168h).
                    format: int64
                    maximum: 2592000
                    minimum: 60
                    type: integer
                  queueTimeoutSeconds:
                    default: 86400
                    description: QueueTimeoutSeconds bounds a single wait in the queue
                      (default 24h).
                    format: int64
                    minimum: 60
                    type: integer
                type: object
              gpuType:
                description: |-
                  GPUType pins workers to nodes exposing this GPU type
                  (node label `scclabs.dev/gpu`, e.g. rtx-5090).
                type: string
              image:
                description: Image is the training container image.
                minLength: 1
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector is merged into the worker node selector.
                type: object
              pricePerWorkerHour:
                default: "0.00"
                description: |-
                  PricePerWorkerHour is the spot price per worker in CNY/hour, used for
                  cost display and segments (PRD 7.8). Serialized as a decimal string so
                  the value survives JSON round-trips in every language.
                pattern: ^[0-9]+(\.[0-9]{1,2})?$
                type: string
              publicData:
                description: PublicData is an optional read-only platform dataset
                  mount.
                properties:
                  claimName:
                    description: ClaimName is the PVC to mount.
                    minLength: 1
                    type: string
                  mountPath:
                    description: MountPath must be an absolute path.
                    pattern: ^/[^ ]*$
                    type: string
                  readOnly:
                    default: false
                    description: ReadOnly mounts the volume read-only.
                    type: boolean
                  subPath:
                    description: SubPath is an optional sub-directory of the volume.
                    type: string
                required:
                - claimName
                - mountPath
                type: object
              resources:
                default: {}
                description: Resources is the per-worker compute shape.
                properties:
                  cpu:
                    default: "8"
                    description: CPU is the CPU request/limit per worker, e.g. "16".
                    type: string
                  gpusPerWorker:
                    default: 1
                    description: GPUsPerWorker is the number of GPUs attached to every
                      worker.
                    format: int32
                    minimum: 0
                    type: integer
                  memory:
                    default: 32Gi
                    description: Memory is the memory request/limit per worker, e.g.
                      "64Gi".
                    type: string
                type: object
              runID:
                default: 1
                description: |-
                  RunID is the user-facing run identifier. It starts at 1, stays unchanged
                  across automatic restarts and continue operations, and increments on re-run.
                format: int32
                minimum: 1
                type: integer
              runtimeRef:
                default: torch-distributed
                description: RuntimeRef names the ClusterTrainingRuntime used as the
                  render base.
                type: string
              sharedStorage:
                description: SharedStorage is mounted read-write into every worker
                  (PRD 7.3.7).
                items:
                  description: StorageMount mounts a PVC into every worker.
                  properties:
                    claimName:
                      description: ClaimName is the PVC to mount.
                      minLength: 1
                      type: string
                    mountPath:
                      description: MountPath must be an absolute path.
                      pattern: ^/[^ ]*$
                      type: string
                    readOnly:
                      default: false
                      description: ReadOnly mounts the volume read-only.
                      type: boolean
                    subPath:
                      description: SubPath is an optional sub-directory of the volume.
                      type: string
                  required:
                  - claimName
                  - mountPath
                  type: object
                type: array
              suspend:
                description: |-
                  Suspend stops the underlying TrainJob without ending the task
                  (equivalent to DesiredState=Stopped, kept for Jobs-style UX).
                type: boolean
              tolerations:
                description: Tolerations are applied to every worker pod.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              workers:
                default: 1
                description: Workers is the number of workers (>= 1). All workers
                  are scheduled as a gang.
                format: int32
                maximum: 256
                minimum: 1
                type: integer
            required:
            - command
            - image
            type: object
          status:
            description: TrainTaskStatus defines the observed state of TrainTask.
            properties:
              accumulatedCost:
                description: AccumulatedCost is the accumulated cost of the current
                  run in CNY.
                type: string
              appliedAction:
                description: |-
                  AppliedAction records the last action id whose status-side effects were
                  applied, so a repeated request is honoured once.
                type: string
              billedSeconds:
                description: BilledSeconds is the accumulated billed time of the current
                  run.
                format: int64
                type: integer
              completionTime:
                description: CompletionTime is when the task entered a terminal phase.
                format: date-time
                type: string
              conditions:
                description: Conditions are standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              excludedNodes:
                description: ExcludedNodes lists nodes excluded for the rest of this
                  run (PRD 7.7.7).
                items:
                  type: string
                type: array
              maxPreemptions:
                format: int32
                type: integer
              maxRestarts:
                description: MaxRestarts and MaxPreemptions mirror the effective budgets
                  for display.
                format: int32
                type: integer
              message:
                description: Message explains the current phase or the terminal reason.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              preemptionCount:
                description: PreemptionCount is the preemption re-queue budget already
                  consumed.
                format: int32
                type: integer
              queuedSince:
                description: QueuedSince is when the current queue wait started.
                format: date-time
                type: string
              reason:
                description: Reason is a machine-readable terminal / recovery reason.
                type: string
              restartCount:
                description: RestartCount is the failure-class restart budget already
                  consumed.
                format: int32
                type: integer
              round:
                description: Round is the 1-based attempt counter within the current
                  run.
                format: int32
                type: integer
              runID:
                description: RunID is the RUN_ID currently executing.
                format: int32
                type: integer
              segmentStartedAt:
                description: SegmentStartedAt is when the current billed segment started.
                format: date-time
                type: string
              segments:
                description: Segments is the per-round billing history of the current
                  run.
                items:
                  description: |-
                    RunSegment is one billed run segment (PRD 7.8.2): from the moment every worker
                    is running to the moment the round ends.
                  properties:
                    amount:
                      description: Amount is BilledSeconds × workers × price, rounded
                        to cents.
                      type: string
                    billedSeconds:
                      description: BilledSeconds is the billed duration of the segment.
                      format: int64
                      type: integer
                    endReason:
                      description: EndReason is one of the Reason* constants.
                      type: string
                    endedAt:
                      description: EndedAt is when the round ended.
                      format: date-time
                      type: string
                    pricePerWorkerHour:
                      description: PricePerWorkerHour is the price used for this segment.
                      type: string
                    round:
                      description: Round is the 1-based attempt index within the run.
                      format: int32
                      type: integer
                    runID:
                      description: RunID is the run this segment belongs to.
                      format: int32
                      type: integer
                    startedAt:
                      description: StartedAt is when all workers started running.
                      format: date-time
                      type: string
                    workers:
                      description: Workers is the worker count used for pricing.
                      format: int32
                      type: integer
                  required:
                  - billedSeconds
                  - round
                  - runID
                  type: object
                type: array
              startedAt:
                description: StartedAt is when all workers of the first round started
                  running.
                format: date-time
                type: string
              startedRound:
                description: |-
                  StartedRound is the round whose TrainJob exists right now (0 when none).
                  It lets the operator tell its own deletions from platform preemption.
                format: int32
                type: integer
              startingStep:
                description: StartingStep is the current step while Phase=Starting.
                type: string
              workers:
                description: Workers reports the current worker placement.
                items:
                  description: WorkerPod reports one worker's placement.
                  properties:
                    name:
                      description: Name is the pod name.
                      type: string
                    node:
                      description: Node is the node the worker landed on.
                      type: string
                    phase:
                      description: Phase is the pod phase.
                      type: string
                    workerIndex:
                      description: WorkerIndex is PET_NODE_RANK.
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
