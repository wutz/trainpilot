name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  image:
    name: Publish image and chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the manager image
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          make docker-buildx \
            IMG=ghcr.io/${REPO}:${VERSION#v} \
            PLATFORMS=linux/amd64,linux/arm64
          docker buildx imagetools create -t ghcr.io/${REPO}:latest ghcr.io/${REPO}:${VERSION#v}

      - name: Log in to Helm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Package and push the chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make helm-push \
            VERSION=${VERSION#v} \
            CHART_VERSION=${VERSION#v}
