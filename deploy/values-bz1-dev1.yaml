# bz1-dev1 部署覆盖值：集群内 GPU 节点标签为 scclabs.dev/gpu=rtx-5090，
# 一台节点带 scclabs.dev/vgpu:NoSchedule 污点；对外入口走 ingress-nginx 的 7443。
image:
  repository: ghcr.io/wutz/trainpilot
  tag: "0.1.6"

ingress:
  enabled: true
  host: trainpilot.wutz.dev
  tls:
    enabled: true
    secretName: trainpilot-tls
    # wutz.dev 的 DNS 在 Cloudflare，集群里唯一的 ACME 求解器只覆盖 paracloud.com，
    # 因此用自签 issuer；浏览器会告警，验证用 curl -k --resolve。
    issuerRef:
      name: selfsigned-cluster-issuer
      kind: ClusterIssuer

webhook:
  certManager:
    issuerRef:
      name: selfsigned-cluster-issuer
      kind: ClusterIssuer
