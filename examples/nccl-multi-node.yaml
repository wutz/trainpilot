# Two workers x 8 GPUs across two nodes: verifies multi-node rendering
# (NNODES / NODE_RANK / MASTER_ADDR, hostNetwork, rdma/hca) with a real
# cross-node NCCL all-reduce. The CUDA source is embedded so the pod needs
# nothing but the nccl-tests devel image.
#
# Regenerate with: make example-multi-node
apiVersion: trainpilot.wutz.dev/v1alpha1
kind: TrainTask
metadata:
  name: nccl-multi
  namespace: trainpilot-demo
spec:
  description: 双节点 16 卡 NCCL all_reduce（跨节点 RoCE）
  image: mir.blsc.cn/library/coreweave/nccl-tests:12.9.1-devel-ubuntu22.04-nccl2.27.6-1-7c12c62
  command:
    - |
      set -eux
      nvidia-smi -L
      cat >/tmp/allreduce.cu <<'CU'
        // A self-contained multi-node NCCL all-reduce, used to verify TrainPilot's
        // multi-node rendering (NNODES / NODE_RANK / MASTER_ADDR, hostNetwork, RDMA).
        //
        // It exists because the usual multi-node NCCL test needs MPI plus an SSH mesh,
        // which would test MPI as much as the operator. Here the rendezvous is a plain
        // TCP socket to MASTER_ADDR:MASTER_PORT (the same information PyTorch's env://
        // rendezvous uses), the ncclUniqueId is broadcast through it, and one child
        // process is forked per GPU on the node.
        //
        // This file is embedded verbatim in nccl-multi-node.yaml, which must stay in
        // sync with it.
        #include <arpa/inet.h>
        #include <cuda_runtime.h>
        #include <nccl.h>
        #include <math.h>
        #include <netdb.h>
        #include <netinet/in.h>
        #include <pthread.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <sys/socket.h>
        #include <sys/types.h>
        #include <unistd.h>
        
        #define MAX_CONN 256
        #define MAX_NODES 64
        
        static void die(const char *what) {
          fprintf(stderr, "error: %s\n", what);
          exit(1);
        }
        
        static void send_all(int fd, const void *buf, size_t len) {
          // nvcc compiles .cu as C++, where void* does not convert to char* implicitly.
          const char *p = (const char *)buf;
          while (len > 0) {
            ssize_t n = send(fd, p, len, 0);
            if (n <= 0) die("send");
            p += n;
            len -= (size_t)n;
          }
        }
        
        static void recv_all(int fd, void *buf, size_t len) {
          char *p = (char *)buf;
          while (len > 0) {
            ssize_t n = recv(fd, p, len, 0);
            if (n <= 0) die("recv");
            p += n;
            len -= (size_t)n;
          }
        }
        
        __global__ void fill(float *v, float x, size_t n) {
          size_t i = blockIdx.x * (size_t)blockDim.x + threadIdx.x;
          if (i < n) v[i] = x;
        }
        
        // atoi would turn Trainer's PET_NPROC_PER_NODE=auto into 0, so only a fully
        // numeric value is accepted; anything else falls back.
        static void env_int(const char *name, int *out, int fallback) {
          const char *v = getenv(name);
          char *end = NULL;
          long n;
          if (!v || !*v) {
            *out = fallback;
            return;
          }
          n = strtol(v, &end, 10);
          *out = (end && *end == '\0' && n > 0) ? (int)n : fallback;
        }
        
        static const size_t kCount = 16 * 1024 * 1024;  // 64 MiB of float
        static const int kIters = 20;
        
        // ncclGetUniqueId and the world size are read by every GPU thread after the
        // rendezvous has finished, so they live at file scope.
        static ncclUniqueId g_id;
        static int g_world = 1;
        
        struct slot {
          int rank;
          int device;
          float ms;
          float got;
          double want;
          const char *err;
        };
        
        // run_gpu holds every rank that lives on this node: it initializes the rank's
        // communicator, then times kIters all-reduces and checks the summed value.
        static void *run_gpu(void *arg) {
          struct slot *s = (struct slot *)arg;
          if (cudaSetDevice(s->device) != cudaSuccess) {
            s->err = "cudaSetDevice";
            return NULL;
          }
          ncclComm_t comm;
          if (ncclCommInitRank(&comm, g_world, g_id, s->rank) != ncclSuccess) {
            s->err = "ncclCommInitRank";
            return NULL;
          }
          float *buf = NULL;
          if (cudaMalloc(&buf, kCount * sizeof(float)) != cudaSuccess) {
            s->err = "cudaMalloc";
            return NULL;
          }
          fill<<<(kCount + 255) / 256, 256>>>(buf, (float)(s->rank + 1), kCount);
          cudaDeviceSynchronize();
          if (ncclAllReduce(buf, buf, kCount, ncclFloat, ncclSum, comm, 0) != ncclSuccess) {
            s->err = "ncclAllReduce warmup";
            return NULL;
          }
          cudaDeviceSynchronize();
        
          cudaEvent_t start, stop;
          cudaEventCreate(&start);
          cudaEventCreate(&stop);
          cudaEventRecord(start);
          for (int i = 0; i < kIters; i++) {
            if (ncclAllReduce(buf, buf, kCount, ncclFloat, ncclSum, comm, 0) != ncclSuccess) {
              s->err = "ncclAllReduce";
              return NULL;
            }
          }
          cudaEventRecord(stop);
          // NCCL runs the collective on its own internal stream, so work issued to the
          // user stream does not order after it: both the stop timestamp and the
          // buffer read need an explicit device sync.
          if (cudaDeviceSynchronize() != cudaSuccess) {
            s->err = "cudaDeviceSynchronize";
            return NULL;
          }
          cudaEventSynchronize(stop);
          cudaEventElapsedTime(&s->ms, start, stop);
        
          // The timed loop is in-place and repeated, so every iteration multiplies the
          // buffer by the world size; its final contents can never be checked against
          // the sum of the initial values. Refill and reduce once more for the check.
          fill<<<(kCount + 255) / 256, 256>>>(buf, (float)(s->rank + 1), kCount);
          cudaDeviceSynchronize();
          if (ncclAllReduce(buf, buf, kCount, ncclFloat, ncclSum, comm, 0) != ncclSuccess) {
            s->err = "ncclAllReduce (check)";
            return NULL;
          }
          cudaDeviceSynchronize();
        
          float got = 0;
          cudaMemcpy(&got, buf, sizeof(float), cudaMemcpyDeviceToHost);
          s->got = got;
          s->want = (double)g_world * (g_world + 1) / 2.0;
        
          ncclCommDestroy(comm);
          cudaFree(buf);
          return NULL;
        }
        
        int main(void) {
          int nodes = 1, node_rank = 0, gpus = 1, port = 29500;
          env_int("NNODES", &nodes, 1);
          env_int("NODE_RANK", &node_rank, 0);
          // Trainer reports PET_NPROC_PER_NODE=auto when it did not decide a count, so
          // an unusable value means "use every visible GPU".
          int devices = 0;
          if (cudaGetDeviceCount(&devices) != cudaSuccess || devices < 1) devices = 1;
          env_int("GPUS_PER_NODE", &gpus, devices);
          if (gpus > devices) {
            printf("[node %d] GPUS_PER_NODE=%d but only %d devices are visible\n",
                   node_rank, gpus, devices);
            gpus = devices;
          }
          env_int("MASTER_PORT", &port, 29500);
          const char *master = getenv("MASTER_ADDR");
          if (!master || !*master) die("MASTER_ADDR is not set");
        
          int world = nodes * gpus;
          if (world > MAX_CONN) die("world size too large");
        
          ncclUniqueId id;
          if (node_rank == 0) {
            int ls = socket(AF_INET, SOCK_STREAM, 0);
            if (ls < 0) die("socket");
            int on = 1;
            setsockopt(ls, SOL_SOCKET, SO_REUSEADDR, &on, sizeof on);
            struct sockaddr_in addr;
            memset(&addr, 0, sizeof addr);
            addr.sin_family = AF_INET;
            addr.sin_port = htons((uint16_t)port);
            addr.sin_addr.s_addr = INADDR_ANY;
            if (bind(ls, (struct sockaddr *)&addr, sizeof addr) < 0) die("bind");
            if (listen(ls, nodes) < 0) die("listen");
            printf("[rank 0] rendezvous on %s:%d for %d nodes x %d gpus\n", master, port,
                   nodes, gpus);
            fflush(stdout);
            int conns[MAX_NODES];
            for (int i = 1; i < nodes; i++) {
              conns[i] = accept(ls, NULL, NULL);
              if (conns[i] < 0) die("accept");
              int peer = -1;
              recv_all(conns[i], &peer, sizeof peer);
              printf("[rank 0] node %d joined\n", peer);
              fflush(stdout);
            }
            if (ncclGetUniqueId(&id) != ncclSuccess) die("ncclGetUniqueId");
            for (int i = 1; i < nodes; i++) send_all(conns[i], &id, sizeof id);
          } else {
            int fd = -1;
            for (int attempt = 0; attempt < 120 && fd < 0; attempt++) {
              fd = socket(AF_INET, SOCK_STREAM, 0);
              struct sockaddr_in addr;
              memset(&addr, 0, sizeof addr);
              addr.sin_family = AF_INET;
              addr.sin_port = htons((uint16_t)port);
              struct hostent *h = gethostbyname(master);
              if (!h) die("resolve MASTER_ADDR");
              memcpy(&addr.sin_addr, h->h_addr_list[0], sizeof addr.sin_addr);
              if (connect(fd, (struct sockaddr *)&addr, sizeof addr) == 0) break;
              close(fd);
              fd = -1;
              sleep(1);
            }
            if (fd < 0) die("connect to master");
            send_all(fd, &node_rank, sizeof node_rank);
            recv_all(fd, &id, sizeof id);
          }
        
            // One thread per GPU. A thread per device keeps every rank's CUDA context in
          // the process that initialized it; fork() after CUDA init leaves the child
          // with a broken runtime (cudaSetDevice fails), and the "last fork returns 0
          // in the parent" trick also makes the parent duplicate one rank.
          static struct slot slots[MAX_CONN];
          pthread_t threads[MAX_CONN];
          g_world = world;
          g_id = id;
          memset(slots, 0, sizeof slots);
          for (int g = 0; g < gpus; g++) {
            slots[g].rank = node_rank * gpus + g;
            slots[g].device = g;
            if (pthread_create(&threads[g], NULL, run_gpu, &slots[g]) != 0)
              die("pthread_create");
          }
          for (int g = 0; g < gpus; g++) pthread_join(threads[g], NULL);
        
          int failed = 0;
          for (int g = 0; g < gpus; g++) {
            if (slots[g].err) {
              fprintf(stderr, "[rank %d] %s failed\n", slots[g].rank, slots[g].err);
              failed = 1;
            } else if (fabs(slots[g].got - slots[g].want) > 1e-3) {
              fprintf(stderr, "[rank %d] wrong result: got %f want %f\n", slots[g].rank,
                      slots[g].got, slots[g].want);
              failed = 1;
            }
          }
        
          double per_rank = (double)(kCount * sizeof(float)) / 1e9;
          float ms = slots[0].ms;
          if (node_rank == 0) {
            printf("\n# world=%d (%d nodes x %d gpus), 64 MiB float32 sum all-reduce\n",
                   world, nodes, gpus);
            printf("# bus bandwidth = %.2f GB/s, algbw = %.2f GB/s, %.3f ms/iter\n",
                   (2.0 * (world - 1) / world * per_rank) / (ms / 1000.0 / kIters),
                   per_rank / (ms / 1000.0 / kIters), ms / kIters);
          }
          printf("[node %d] ranks %d-%d %s\n", node_rank, node_rank * gpus,
                 node_rank * gpus + gpus - 1, failed ? "FAILED" : "agreed");
          if (node_rank == 0 && !failed) printf("RESULT: OK (all %d ranks agreed)\n", world);
          return failed ? 1 : 0;
        }
      CU
      nvcc -O2 -Xcompiler -pthread -o /tmp/allreduce /tmp/allreduce.cu -lnccl
      # No numeric fallback here: Trainer sets PET_NPROC_PER_NODE=auto, and the
      # program itself clamps to the GPUs actually visible in the container.
      NODE_RANK="${NODE_RANK:-0}" GPUS_PER_NODE="${PET_NPROC_PER_NODE}" /tmp/allreduce
  workers: 2
  gpuType: NVIDIA-A100-SXM4-80GB
  resources:
    gpusPerWorker: 8
    cpu: "32"
    memory: 128Gi
  faultTolerance:
    autoRestart: true
    maxRestarts: 3
    maxRuntimeSeconds: 3600
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
