# Single node, 8 GPUs: proves the whole path — Kueue admission (when a queue is
# configured), worker rendering, GPU/NCCL inside the container, metering and the
# dashboard.
apiVersion: trainpilot.wutz.dev/v1alpha1
kind: TrainTask
metadata:
  name: nccl-single
  namespace: trainpilot-demo
spec:
  description: 单机 8 卡 NCCL all_reduce 基准
  image: mir.blsc.cn/library/coreweave/nccl-tests:12.9.1-devel-ubuntu22.04-nccl2.27.6-1-7c12c62
  command:
    - |
      set -eux
      nvidia-smi -L
      /opt/nccl_tests/build/all_reduce_perf -b 8 -e 8G -f 2 -g 8
  workers: 1
  gpuType: NVIDIA-A100-SXM4-80GB
  resources:
    gpusPerWorker: 8
    cpu: "32"
    memory: 128Gi
  faultTolerance:
    autoRestart: true
    maxRestarts: 3
    maxRuntimeSeconds: 3600
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
