# 整任务成组排队：4 个任务各要 1 个整机（8 卡），集群只有 3 台 GPU 节点。
# 期望：前 3 个进入 Running，第 4 个停在 Queued（条件是 3 个节点全部空闲才放行），
# 停掉/删除其中一个后，第 4 个立即开始。
apiVersion: trainpilot.wutz.dev/v1alpha1
kind: TrainTask
metadata:
  name: verify-queue-1
spec:
  image: busybox:1.36
  command: ["echo holding node 1; sleep 900"]
  workers: 1
  gpuType: rtx-5090
  resources:
    gpusPerWorker: 8
    cpu: "4"
    memory: 16Gi
  pricePerWorkerHour: "24.00"
  tolerations:
    - key: scclabs.dev/vgpu
      operator: Exists
      effect: NoSchedule
---
