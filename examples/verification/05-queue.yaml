# 整任务成组排队：3 个任务各要 1 个 worker、每 worker 3 张 GPU。
# 排队与准入交给 Kueue：先按 examples/kueue/queues.yaml 建好队列，并保证本命名空间有
# 名为 gpu 的 LocalQueue（或把 queueName 改成实际名字）。
# 期望：配额只够 3 张卡时 verify-queue-1 进入 Running，其余停在 Queued（等待 Kueue 准入）；
# 删掉 verify-queue-1 腾出配额后，verify-queue-2 被准入并开始。顺序由 Kueue 的 FIFO 决定。
apiVersion: trainpilot.wutz.dev/v1alpha1
kind: TrainTask
metadata:
  name: verify-queue-1
spec:
  image: busybox:1.36
  command: ["echo holding 3 gpus; sleep 900"]
  workers: 1
  queueName: gpu
  gpuType: NVIDIA-A100-SXM4-80GB
  resources:
    gpusPerWorker: 3
    cpu: "4"
    memory: 16Gi
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: trainpilot.wutz.dev/v1alpha1
kind: TrainTask
metadata:
  name: verify-queue-2
spec:
  image: busybox:1.36
  command: ["echo I had to wait; sleep 60"]
  workers: 1
  queueName: gpu
  gpuType: NVIDIA-A100-SXM4-80GB
  resources:
    gpusPerWorker: 3
    cpu: "4"
    memory: 16Gi
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: trainpilot.wutz.dev/v1alpha1
kind: TrainTask
metadata:
  name: verify-queue-3
spec:
  image: busybox:1.36
  command: ["echo I had to wait too; sleep 60"]
  workers: 1
  queueName: gpu
  gpuType: NVIDIA-A100-SXM4-80GB
  resources:
    gpusPerWorker: 3
    cpu: "4"
    memory: 16Gi
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
