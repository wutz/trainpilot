{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "trainpilot.webhookCertName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trainpilot.labels" . | nindent 4 }}
spec:
  secretName: {{ include "trainpilot.webhookCertName" . }}
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
  dnsNames:
    - {{ include "trainpilot.webhookServiceName" . }}
    - {{ include "trainpilot.webhookServiceName" . }}.{{ .Release.Namespace }}
    - {{ include "trainpilot.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
    - {{ include "trainpilot.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- toYaml .Values.webhook.certManager.issuerRef | nindent 4 }}
{{- end }}
{{- if .Values.webhook.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ printf "%s-traintask" (include "trainpilot.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "trainpilot.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "trainpilot.webhookCertName" . }}
  {{- end }}
webhooks:
  - name: vtraintask.trainpilot.wutz.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "trainpilot.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-trainpilot-wutz-dev-v1alpha1-traintask
        port: 443
    rules:
      - apiGroups: ["trainpilot.wutz.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["traintasks"]
        scope: Namespaced
{{- end }}
