{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trainpilot.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trainpilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trainpilot.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
{{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trainpilot.uiServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trainpilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trainpilot.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: ui
      protocol: TCP
{{- end }}
