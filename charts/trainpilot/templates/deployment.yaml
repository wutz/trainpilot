apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trainpilot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trainpilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trainpilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "trainpilot.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "trainpilot.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "trainpilot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            - --gpu-node-label={{ .Values.controller.gpuNodeLabel }}
            - --gpu-toleration-keys={{ .Values.controller.gpuTolerationKeys }}
            - --shared-memory-ratio={{ .Values.controller.sharedMemoryRatio }}
            {{- if .Values.controller.workerServiceAccount }}
            - --worker-service-account={{ .Values.controller.workerServiceAccount }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- if .Values.ui.enabled }}
            - --ui-bind-address=:{{ .Values.ui.port }}
            {{- else }}
            - --ui-bind-address=
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhook=true
            - --webhook-port={{ .Values.webhook.port }}
            {{- if .Values.webhook.certManager.enabled }}
            - --webhook-cert-path={{ .Values.webhook.certDir }}
            {{- end }}
            {{- else }}
            - --enable-webhook=false
            {{- end }}
            {{- with .Values.controller.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.ui.enabled }}
            - name: ui
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
            - name: webhook-certs
              mountPath: {{ .Values.webhook.certDir }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "trainpilot.webhookCertName" . }}
            defaultMode: 420
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
